name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set unique development build number
        shell: bash
        run: echo "JOLT_BUILD_NUMBER=$(date +%s)" >> "$GITHUB_ENV"

      - name: Configure persistent development signing
        env:
          JOLT_DEV_KEYSTORE_BASE64: ${{ secrets.JOLT_DEV_KEYSTORE_BASE64 }}
          JOLT_DEV_STORE_PASSWORD: ${{ secrets.JOLT_DEV_STORE_PASSWORD }}
          JOLT_DEV_KEY_ALIAS: ${{ secrets.JOLT_DEV_KEY_ALIAS }}
          JOLT_DEV_KEY_PASSWORD: ${{ secrets.JOLT_DEV_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$JOLT_DEV_KEYSTORE_BASE64" ]]; then
            printf '%s' "$JOLT_DEV_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/jolt-time-development.jks"
            cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/jolt-time-development.jks
          storePassword=$JOLT_DEV_STORE_PASSWORD
          keyAlias=$JOLT_DEV_KEY_ALIAS
          keyPassword=$JOLT_DEV_KEY_PASSWORD
          EOF
          else
            echo "::warning::Persistent Jolt Time signing secrets are not configured. This APK may not update a previously installed CI APK in place."
          fi

      - name: Clean
        run: gradle clean

      - name: Run unit tests
        run: gradle testDebugUnitTest

      - name: Run Android lint
        run: gradle lintDebug

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Package and validate versioned APK
        id: package
        shell: bash
        run: |
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$SOURCE_APK"
          BADGING="$(${ANDROID_HOME}/build-tools/35.0.0/aapt dump badging "$SOURCE_APK")"
          grep -F "package: name='com.jolttime.game'" <<<"$BADGING"
          grep -F "application-debuggable" <<<"$BADGING"
          VERSION_CODE="$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" <<<"$BADGING" | head -n1)"
          VERSION_NAME="$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<<"$BADGING" | head -n1)"
          test -n "$VERSION_CODE"
          test -n "$VERSION_NAME"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          APK_BASENAME="Jolt-Time-v${VERSION_NAME}-b${VERSION_CODE}-${SHORT_SHA}.apk"
          ARTIFACT_NAME="${APK_BASENAME%.apk}"
          mkdir -p dist
          cp "$SOURCE_APK" "dist/$APK_BASENAME"
          FINAL_APK="dist/$APK_BASENAME"
          test -s "$FINAL_APK"
          unzip -t "$FINAL_APK"
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify "$FINAL_APK"
          echo "apk_path=$FINAL_APK" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_BASENAME" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Write build summary
        shell: bash
        run: |
          {
            echo "## Jolt Time Android Build"
            echo
            echo "- Version: ${{ steps.package.outputs.version_name }}"
            echo "- Build: ${{ steps.package.outputs.version_code }}"
            echo "- Commit: ${{ steps.package.outputs.short_sha }}"
            echo "- APK: ${{ steps.package.outputs.apk_name }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload versioned debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ steps.package.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14
