name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Configure persistent development signing
        env:
          JOLT_DEV_KEYSTORE_BASE64: ${{ secrets.JOLT_DEV_KEYSTORE_BASE64 }}
          JOLT_DEV_STORE_PASSWORD: ${{ secrets.JOLT_DEV_STORE_PASSWORD }}
          JOLT_DEV_KEY_ALIAS: ${{ secrets.JOLT_DEV_KEY_ALIAS }}
          JOLT_DEV_KEY_PASSWORD: ${{ secrets.JOLT_DEV_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$JOLT_DEV_KEYSTORE_BASE64" ]]; then
            printf '%s' "$JOLT_DEV_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/jolt-time-development.jks"
            cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/jolt-time-development.jks
          storePassword=$JOLT_DEV_STORE_PASSWORD
          keyAlias=$JOLT_DEV_KEY_ALIAS
          keyPassword=$JOLT_DEV_KEY_PASSWORD
          EOF
          else
            echo "Persistent signing secrets are absent; using the runner debug key."
          fi

      - name: Clean
        run: gradle clean

      - name: Run unit tests
        run: gradle testDebugUnitTest

      - name: Run Android lint
        run: gradle lintDebug

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Validate debug APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          BADGING="$(${ANDROID_HOME}/build-tools/35.0.0/aapt dump badging "$APK")"
          grep -F "package: name='com.jolttime.game'" <<<"$BADGING"
          grep -F "application-debuggable" <<<"$BADGING"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Jolt-Time-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
